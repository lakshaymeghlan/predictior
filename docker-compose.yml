version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: predictor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: predictor_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  python-worker:
    build:
      context: ./backend/python-worker
      dockerfile: Dockerfile
    container_name: predictor_python_worker
    env_file:
      - ./backend/python-worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/python-worker:/app
    command: ["python","ingest.py"]

  node-api:
    build:
      context: ./backend/node-api
      dockerfile: Dockerfile
    container_name: predictor_node_api
    env_file:
      - ./backend/node-api/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/node-api:/usr/src/app
    depends_on:
      - postgres

volumes:
  pgdata:
  miniodata:
